<style>
:root { --gold:#C48A28; --cream:#F2DDAA; --panel:#150C03; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#000; overflow:hidden; font-family:Palatino,Georgia,serif; }

#mira {

  border-radius:50%; background:rgba(242,221,170,.7); pointer-events:none; z-index:50;

<script>

/* ══════════════════════════════════════════
   CONNESSIONE SUPABASE E STATO CONDIVISO
   (identico alla versione 360°: stessa tabella,
   stessa logica di salvataggio/realtime)
   ══════════════════════════════════════════ */

const SUPABASE_URL = "https://vozzdhpwiauchvznfvsi.supabase.co";
const SUPABASE_KEY = "sb_publishable_aLZfS_idBIXD1mEixlnGsA_FF70VGni";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CODICE_PARTITA = sessionStorage.getItem("codicePartita");

let statoLocale = { indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
let statoCaricato = false;

async function caricaStatoRemoto() {
  const { data, error } = await sb.from("partite").select("*").eq("codice", CODICE_PARTITA).maybeSingle();
  if (!data) {
    const nuova = { codice: CODICE_PARTITA, indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
    await sb.from("partite").insert(nuova);
    statoLocale = nuova;
  } else {
    statoLocale = data;
    if (!statoLocale.messaggi) statoLocale.messaggi = [];
  }
  statoCaricato = true;
}

async function salvaStatoRemoto() {
  const { codice, indizi, risposte, serrature_sbloccate, messaggi } = statoLocale;
  await sb.from("partite").update({ indizi, risposte, serrature_sbloccate, messaggi,
    aggiornato_il: new Date().toISOString() }).eq("codice", codice);
}

function iscrivitiAggiornamenti() {
  sb.channel("partita-" + CODICE_PARTITA)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "partite", filter: `codice=eq.${CODICE_PARTITA}` },
      payload => {
        statoLocale = payload.new;
        if (!statoLocale.messaggi) statoLocale.messaggi = [];
        aggiornaFeedTaccuino();
        // se qualcun altro ha appena sbloccato la serratura di questa
        // stanza, la porta si apre visibilmente anche qui — idempotente:
        // se era già aperta non cambia nulla
        if (typeof STANZA_ID !== "undefined" && typeof impostaPorta === "function"
            && serraturaSbloccata(STANZA_ID)) {
          impostaPorta(true);
        }
      })
    .subscribe();
}

function aggiungiIndizio(id, testo, stanza) {
  if (!statoLocale.indizi.find(i => i.id === id)) {
    statoLocale.indizi.push({ id, testo, stanza, quando: Date.now() });
    salvaStatoRemoto();
  }
}
function serraturaSbloccata(stanzaId) {
  return statoLocale.serrature_sbloccate.includes(stanzaId);
}
function sbloccaSerratura(stanzaId) {
  if (!statoLocale.serrature_sbloccate.includes(stanzaId)) {
    statoLocale.serrature_sbloccate.push(stanzaId);
    const r = statoLocale.risposte = statoLocale.risposte || {};
    r.tempi = r.tempi || {};
    r.tempi[stanzaId] = Object.assign(r.tempi[stanzaId] || {}, { fine: Date.now() });
    salvaStatoRemoto();
  }
}
function registraIngressoStanza() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.tempi = r.tempi || {};
  if (!r.tempi[STANZA_ID]) { r.tempi[STANZA_ID] = { inizio: Date.now() }; salvaStatoRemoto(); }
}
function registraErrore() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.errori = r.errori || {};
  r.errori[STANZA_ID] = (r.errori[STANZA_ID] || 0) + 1;
  salvaStatoRemoto();
}


function escapeHtml(str) {
  return (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ══════════════════════════════════════════
   POPUP (stesso motore usato nelle stanze 360°)
   ══════════════════════════════════════════ */
function mostraPopup(html) {
  document.getElementById("popup").innerHTML = html;
  document.getElementById("velo").classList.add("attivo");
}
function chiudiPopup() {
  document.getElementById("velo").classList.remove("attivo");
  document.getElementById("popup").innerHTML = "";
}
document.addEventListener("DOMContentLoaded", () => {
  const velo = document.getElementById("velo");
  velo.addEventListener("click", e => { if (e.target === velo && !window._popupBloccato) chiudiPopup(); });
});

/* ══════════════════════════════════════════
   TACCUINO CONDIVISO (feed cronologico indizi + messaggi)
   ══════════════════════════════════════════ */
function costruisciFeedHtml() {
  const voci = [
    ...statoLocale.indizi.map(i => ({ tipo:"indizio", testo:`${i.stanza} — ${i.testo}`, quando:i.quando||0 })),
    ...(statoLocale.messaggi||[]).map(m => ({ tipo:"messaggio", testo:m.testo, quando:m.quando||0 }))
  ].sort((a,b) => a.quando - b.quando);

  if (!voci.length) return `<div class="testo corsivo">Ancora nessun indizio né messaggio.</div>`;

  return voci.map(v => `
    <div class="voce-feed ${v.tipo}">
      <span class="etichetta-feed">${v.tipo === "indizio" ? "📖" : "💬"}</span>${escapeHtml(v.testo)}
    </div>
  `).join("");
}

function aggiornaFeedTaccuino() {
  const el = document.getElementById("listaFeed");
  if (!el) return;
  el.innerHTML = costruisciFeedHtml();
  el.scrollTop = el.scrollHeight;
}

function apriTaccuino() {
  window._popupBloccato = false;
  const bt = document.getElementById("btnTaccuino");
  if (bt) bt.classList.remove("illuminato");
  if (typeof tut !== "undefined") tut.taccuinoAperto = true;
  mostraPopup(`
    <div class="nome">― Taccuino condiviso ―</div>
    <div class="taccuino-feed" id="listaFeed">${costruisciFeedHtml()}</div>
    <div class="input-messaggio-riga">
      <input type="text" id="inputMessaggio" placeholder="Scrivi un messaggio…"
        onkeydown="if(event.key==='Enter')inviaMessaggio()">
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
    <div class="bottoni" style="margin-top:16px"><button class="si" onclick="chiudiPopup()">Chiudi</button></div>
  `);
  setTimeout(() => {
    const el = document.getElementById("listaFeed");
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function inviaMessaggio() {
  const input = document.getElementById("inputMessaggio");
  const testo = input.value.trim();
  if (!testo) return;
  if (!statoLocale.messaggi) statoLocale.messaggi = [];
  statoLocale.messaggi.push({ testo, quando: Date.now() });
  input.value = "";
  salvaStatoRemoto();
  aggiornaFeedTaccuino();
}

function iniettaControlliFissi(stanzaPrecedenteUrl) {
  const div = document.createElement("div");
  div.innerHTML = `
    <button id="btnIndietro" class="controllo-fisso sinistra" title="Torna indietro">←</button>
    <button id="btnTaccuino" class="controllo-fisso destra" title="Taccuino">📒</button>
    <div class="badge-codice">Partita: ${CODICE_PARTITA}</div>
  `;
  document.body.appendChild(div);
  const btnIndietro = document.getElementById("btnIndietro");
  if (stanzaPrecedenteUrl) {
    btnIndietro.addEventListener("click", () => { window.location.href = stanzaPrecedenteUrl; });
  } else {
    btnIndietro.disabled = true;
  }
  document.getElementById("btnTaccuino").addEventListener("click", apriTaccuino);
}

/* ══════════════════════════════════════════
   ATRIO — stanza tutorial
   Una sala quasi vuota, con pochi oggetti ben riconoscibili: serve a far
   emergere (senza spiegarle subito) le competenze di base — movimento,
   interazione, taccuino. Le tre "domande di verifica" compaiono a tempo,
   confrontando ciò che il giocatore ha FATTO davvero con ciò che SCRIVE.
   ══════════════════════════════════════════ */
const STANZA_ID = "stanza0";
const PROSSIMA_STANZA = "stanza1biblioteca.html";

// con ?veloce nell'indirizzo i tempi si dividono per 10 (solo per provare)
const VELOCE = /veloce/.test(location.search);
const K_TEMPO = VELOCE ? 0.1 : 1;
const TUT = {
  T_MOV: 90000 * K_TEMPO,        // prima domanda: movimento
  T_MAX: 300000 * K_TEMPO,       // massimo per interazione e taccuino
  T_RIPROVA: 60000 * K_TEMPO,    // «non ancora, dammi un minuto»
  T_TAC_ATTESA: 20000 * K_TEMPO, // tra la comparsa della luce sul taccuino e la domanda
  SOGLIA_DIST: 4,                // metri percorsi per dire "si è mosso davvero"
  SOGLIA_ROT: 0.6,               // radianti di sguardo
  MAX_ERRORI: 2,                 // dopo 2 risposte insufficienti si spiega
  MAX_RIMANDI: 3                 // dopo 3 rinvii si spiega
};

const tut = {
  t0: null, dist: 0, rot: 0, ultimaPos: null, ultimoYaw: 0, ultimoPitch: 0,
  interagito: false, taccuinoAperto: false,
  fase: { mov: "attesa", int: "attesa", tac: "attesa" },  // attesa | preparazione | dovuta | chiusa
  tent: { mov: 0, int: 0, tac: 0 },
  rimandi: { mov: 0, int: 0, tac: 0 },
  spiegato: { mov: false, int: false, tac: false },
  dopo: { mov: 0, int: 0, tac: 0 },
  tacPronto: 0, domandaAperta: null, completato: false, portaAttiva: false
};

const TESTI_TUT = {
  mov: {
    dom: "Avete compreso come funziona il movimento? Descrivetelo con le vostre parole.",
    no: "Non ancora, dammi un minuto…",
    ok: "Esatto: avete capito come ci si muove.",
    spiega: "Ecco come funziona: <b>toccate</b> (o cliccate) un punto del pavimento e vi ci avvicinerete camminando; <b>trascinate</b> il dito (o il mouse) sullo schermo per guardarvi intorno.",
    prima: "Provate prima a muovervi davvero nella stanza, poi descrivete cosa avete fatto.",
    ancora: "Non ancora del tutto. Descrivete con più precisione cosa fate sullo schermo per spostarvi e cosa succede."
  },
  int: {
    dom: "Avete compreso come funziona l'interazione? Come si distingue un oggetto con cui si può interagire da uno con cui no?",
    no: "Non ancora, dammi un minuto…",
    ok: "Esatto: avete capito come si interagisce.",
    spiega: "Gli oggetti con cui si può interagire hanno un <b>bagliore dorato che pulsa</b>. Avvicinatevi e <b>toccateli</b> per osservarli: gli altri sono soltanto arredo.",
    prima: "Avete già provato a interagire con qualcosa? Provate, poi rispondete.",
    ancora: "Non ancora del tutto. Guardate bene gli oggetti della stanza: cosa hanno di diverso quelli con cui si può interagire?"
  },
  tac: {
    dom: "Avete notato che esiste un taccuino? Cosa è comparso dentro mentre stavate esplorando?",
    no: "Fammi controllare meglio",
    ok: "Esatto: il taccuino è il vostro alleato.",
    spiega: "Il <b>taccuino</b> 📒, in alto a destra, raccoglie ciò che trovate (indizi, appunti) e i messaggi che vi scrivete: è <b>condiviso</b> con tutto il gruppo. Quando si illumina, c'è qualcosa di nuovo.",
    prima: "Avete già aperto il taccuino? Guardate cosa c'è dentro, poi rispondete.",
    ancora: "Non ancora del tutto. Aprite il taccuino e leggete cosa è comparso."
  }
};

/* ── valutazione delle risposte: azioni reali + parole chiave ── */
function tutNorm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
const RX_AZIONE = /(clicc|click|\bclic\b|tocc|\btap|pigi|premi|schiacc|seleziona|indica)/;
const RX_DOVE = /(pavimento|terra|suolo|punto|pietr|lastr|piastrell|dove|posto|luogo)/;
const RX_CAMMINO = /(cammin|andar|vado|\bvai\b|muov|sposta|raggiung|avvicin|portare)/;
const RX_LUCE = /(illumin|luminos|lampegg|brill|puls|luce|lucc|dorat|giall|\boro\b|bagliore|splend|accend|scintill|risplend|alone|aura|evidenzi|glow|chiar|colorat)/;
const RX_TACCUINO = /(taccuino|appunt|\bnota|\bnote\b|indizi|scritt|messagg|frase|testo|compars|segna|registr|trovat|lanterna|baule|cassa|incis|benvenut)/;

function tutAzioniOk(q) {
  if (q === "mov") return tut.dist >= TUT.SOGLIA_DIST && tut.rot >= TUT.SOGLIA_ROT;
  if (q === "int") return tut.interagito;
  return tut.taccuinoAperto;
}
function tutTestoOk(q, n) {
  if (n.length < 6) return false;
  if (q === "mov") return RX_AZIONE.test(n) && (RX_DOVE.test(n) || RX_CAMMINO.test(n));
  if (q === "int") return RX_LUCE.test(n);
  // taccuino: parole generiche oppure una parola (≥5 lettere) presa dalle voci reali
  if (RX_TACCUINO.test(n)) return true;
  const voci = tutNorm((statoLocale.indizi || []).map(i => i.testo).join(" ") + " " +
                       (statoLocale.messaggi || []).map(m => m.testo).join(" "));
  return n.split(" ").some(w => w.length >= 5 && voci.indexOf(w) >= 0);
}

/* ── tracciamento di movimento e sguardo (chiamato a ogni fotogramma) ── */
function tutTraccia() {
  if (!tut.t0) return;
  if (tut.ultimaPos) {
    tut.dist += Math.hypot(camera.position.x - tut.ultimaPos.x, camera.position.z - tut.ultimaPos.z);
    tut.rot += Math.abs(yaw - tut.ultimoYaw) + Math.abs(pitch - tut.ultimoPitch);
  }
  tut.ultimaPos = { x: camera.position.x, z: camera.position.z };
  tut.ultimoYaw = yaw; tut.ultimoPitch = pitch;
}

function popupAperto() { return document.getElementById("velo").classList.contains("attivo"); }

function illuminaTaccuino() {
  const b = document.getElementById("btnTaccuino");
  if (b) b.classList.add("illuminato");
}

/* ── pianificatore: decide quando far comparire le domande ── */
function tutTick(ora) {
  if (!tut.t0 || tut.completato) return;
  ora = ora || Date.now();
  const trascorso = ora - tut.t0;

  if (tut.fase.mov === "attesa" && trascorso >= TUT.T_MOV) tut.fase.mov = "dovuta";
  if (tut.fase.int === "attesa" && ((tut.interagito && !popupAperto()) || trascorso >= TUT.T_MAX)) tut.fase.int = "dovuta";

  const primeDue = tut.fase.mov === "chiusa" && tut.fase.int === "chiusa";
  if (tut.fase.tac === "attesa" && (primeDue || trascorso >= TUT.T_MAX)) {
    tut.fase.tac = "preparazione";
    preparaTaccuino();
    tut.tacPronto = ora + TUT.T_TAC_ATTESA;
  }
  if (tut.fase.tac === "preparazione" && ora >= tut.tacPronto) tut.fase.tac = "dovuta";
  // chi apre il taccuino da sé riceve la domanda appena lo richiude, senza aspettare
  if ((tut.fase.tac === "attesa" || tut.fase.tac === "preparazione") && tut.taccuinoAperto && !popupAperto())
    tut.fase.tac = "dovuta";

  // se qualcun altro del gruppo ha già aperto la porta, la rendiamo cliccabile anche qui
  if (!tut.portaAttiva && serraturaSbloccata(STANZA_ID)) attivaPorta();

  if (tut.domandaAperta && !popupAperto()) {
    tut.dopo[tut.domandaAperta] = ora + TUT.T_RIPROVA / 2;
    tut.domandaAperta = null;
    window._popupBloccato = false;
  }
  if (popupAperto() || tut.domandaAperta) return;
  for (const q of ["mov", "int", "tac"]) {
    if (tut.fase[q] === "dovuta" && ora >= tut.dopo[q]) { mostraDomanda(q); return; }
  }
  if (["mov", "int", "tac"].every(q => tut.fase[q] === "chiusa")) tutCompleta();
}

function preparaTaccuino() {
  // il taccuino deve contenere qualcosa e farsi notare
  if (!statoLocale.indizi.length && !(statoLocale.messaggi || []).length) {
    aggiungiIndizio("tut_benvenuto",
      "Il taccuino è condiviso: qui compaiono gli indizi che trovate e i messaggi che vi scrivete.", "Atrio");
  }
  illuminaTaccuino();
}

/* ── popup delle tre domande ── */
function mostraDomanda(q) {
  if (tut.rimandi[q] >= TUT.MAX_RIMANDI) { tut.domandaAperta = q; tutSpiega(q); return; }
  tut.domandaAperta = q;
  window._popupBloccato = true;

    <div id="fbTut" class="suggerimento-testo" style="min-height:22px;margin:6px 0"></div>

function tutChiudiDomanda() {
  tut.domandaAperta = null;

}

function tutRimanda(q) {
  tut.rimandi[q]++;
  tut.dopo[q] = Date.now() + TUT.T_RIPROVA;
  tutChiudiDomanda();
}

function tutRispondi(q) {
  const area = document.getElementById("rispTut");
  const fb = document.getElementById("fbTut");
  const n = tutNorm(area ? area.value : "");
  if (n.length < 3) { if (fb) fb.textContent = "Scrivete qualcosa prima di rispondere."; return; }
  const T = TESTI_TUT[q];
  const azioniOk = tutAzioniOk(q), testoOk = tutTestoOk(q, n);
  if (azioniOk && testoOk) { tutRisolta(q); return; }
  tut.tent[q]++;
  if (tut.tent[q] >= TUT.MAX_ERRORI) { tutSpiega(q); return; }
  if (fb) fb.textContent = testoOk && !azioniOk ? T.prima : T.ancora;
}

function tutRisolta(q) {

function creaTexturaPietra() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const toni = ["#6f695c", "#7a7466", "#656053", "#72695a", "#6a6558"];
  const lato = 64;
  for (let y = 0; y < size; y += lato)
    for (let x = 0; x < size; x += lato) {
      ctx.fillStyle = toni[Math.floor(Math.random() * toni.length)];
      ctx.fillRect(x, y, lato - 2, lato - 2);
    }
  ctx.strokeStyle = "rgba(20,14,8,0.6)";
  ctx.lineWidth = 2;
  for (let p = 0; p <= size; p += lato) {
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(STANZA_LATO / 4, STANZA_LATO / 4);
  return texture;
}

/* elenco globale degli oggetti cliccabili/interagibili — popolato mano
   a mano da chi crea porta, libri ecc. Usiamo un array esplicito
   (invece di scene.children) perché molti oggetti interagibili sono
   annidati dentro gruppi (le librerie, i tavoli) e scene.children
   vedrebbe solo il primo livello. */
const oggettiInterattivi = [];
// materiali con bagliore dorato pulsante — stesso linguaggio visivo
// degli hotspot "a bordo dorato pulsante" della versione 360°
const materialiPulsanti = [];
// fiamme (torce, candele, lampade) — tremolio animato nel loop di render;
// ogni voce è { materiale, base, luce? } dove luce è una PointLight vera opzionale
const fiamme = [];

function registraFiamma(materiale, intensitaBase, luce) {
  fiamme.push({
    materiale, base: intensitaBase, luce: luce || null,
    luceBase: luce ? luce.intensity : 0,
    seme: Math.random() * 100
  });
}

function registraInterattivo(mesh, dati) {
  mesh.userData.interagibile = true;
  Object.assign(mesh.userData, dati);
  oggettiInterattivi.push(mesh);
  const materiali = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  materiali.forEach(m => {
    if (m && "emissive" in m) {
      m.emissive = new THREE.Color(0xC48A28);
      m.emissiveIntensity = 0.25;
      materialiPulsanti.push(m);
    }
  });
}

/* ══════════════════════════════════════════
   "SOLIDITÀ" DEGLI ARREDI — non è una vera fisica, ma basta a evitare
   di camminare dentro ai mobili o troppo a ridosso di pareti/porta.
   Ogni ostacolo è un rettangolo assiale {minX,maxX,minZ,maxZ} calcolato
   AUTOMATICAMENTE dal bounding box reale dell'oggetto 3D (THREE.Box3) —
   basta chiamare registraIngombro(gruppo) dopo aver costruito qualunque
   mobile (tavolo, libreria, o quel che aggiungeremo in futuro) e la sua
   sagoma diventa automaticamente invalicabile, senza stimare a mano
   raggi o dimensioni. La correzione viene applicata OGNI FRAME alla
   posizione reale della camera (non solo al punto di destinazione del
   click): così non ci si taglia più dentro l'ostacolo durante il
   tragitto, anche se il punto cliccato era oltre il mobile.
   ══════════════════════════════════════════ */
const RAGGIO_GIOCATORE = 0.45;
const MARGINE_PARETE = 1.3; // distanza minima da pareti/porta
const ingombri = []; // { minX, maxX, minZ, maxZ }

function registraIngombro(oggetto3D, margineExtra = RAGGIO_GIOCATORE) {
  oggetto3D.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(oggetto3D);
  ingombri.push({
    minX: box.min.x - margineExtra, maxX: box.max.x + margineExtra,
    minZ: box.min.z - margineExtra, maxZ: box.max.z + margineExtra
  });
}

function risolviPosizioneValida(x, z) {
  let px = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, x));
  let pz = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, z));
  ingombri.forEach(r => {
    if (px > r.minX && px < r.maxX && pz > r.minZ && pz < r.maxZ) {
      // il punto è dentro l'ingombro: lo spingo fuori dal lato più vicino
      const distSx = px - r.minX, distDx = r.maxX - px;
      const distSu = pz - r.minZ, distGiu = r.maxZ - pz;
      const minDist = Math.min(distSx, distDx, distSu, distGiu);
      if (minDist === distSx) px = r.minX;
      else if (minDist === distDx) px = r.maxX;
      else if (minDist === distSu) pz = r.minZ;
      else pz = r.maxZ;
    }
  });
  return { x: px, z: pz };
}

      <div class="testo" style="font-style:normal">La porta è aperta. Il castello vi aspetta.</div>
      <div class="bottoni">
        <button class="si" onclick="vaiAvanti()">Entriamo →</button>
        <button class="no" onclick="chiudiPopup()">Chiudi</button>
      </div>`);
  }
}


/* ══════════════════════════════════════════
   MOVIMENTO A CLICK (stesso principio del prototipo)
   ══════════════════════════════════════════ */
let target = camera.position.clone();
let inMovimento = false;

const raycaster = new THREE.Raycaster();
const puntatore = new THREE.Vector2();

function pickGroundAt(clientX, clientY) {
  puntatore.x = (clientX / innerWidth) * 2 - 1;
  puntatore.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(puntatore, camera);
  const hit = raycaster.intersectObject(pavimento)[0];
  return hit ? hit.point : null;
}

function pickOggetto(clientX, clientY) {
  puntatore.x = (clientX / innerWidth) * 2 - 1;
  puntatore.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(puntatore, camera);
  const hits = raycaster.intersectObjects(oggettiInterattivi, false);
  return hits[0] ? hits[0].object : null;
}

/* ══════════════════════════════════════════
   SGUARDO A TRASCINAMENTO (mouse o dito, no Pointer Lock)
   ══════════════════════════════════════════ */
let yaw = 0, pitch = 0;
let trascinando = false, ultimoX = 0, ultimoY = 0, mosso = false;
// il gesto è "iniziato sul canvas" solo se mousedown/touchstart sono
// partiti dal canvas — evita che un click su un pulsante HTML fisso
// (torna indietro, taccuino, bottoni del popup) generi anche un click
// "fantasma" nel mondo 3D quando arriva il mouseup globale. Stesso
// identico rischio documentato per il popup, generalizzato qui a
// qualunque elemento HTML sovrapposto al canvas.
let gestoIniziatoSulCanvas = false;

const canvas = document.getElementById("canvas3d");

function inizioTocco(x, y) {
  gestoIniziatoSulCanvas = true;
  trascinando = true; mosso = false; ultimoX = x; ultimoY = y;
}
function muoviTocco(x, y) {
  if (!trascinando) return;
  const dx = x - ultimoX, dy = y - ultimoY;
  if (Math.abs(dx) + Math.abs(dy) > 6) mosso = true;
  // NB: verso invertito rispetto al "mouse-look" FPS diretto — qui si
  // segue la convenzione da viewer panoramico/touch ("trascini la scena",
  // come in uno street-view), più naturale su tablet senza pointer lock.
  // Se dopo il test preferisci il verso FPS classico, basta togliere il segno "-".
  yaw += dx * 0.004;
  pitch = Math.max(-1, Math.min(1, pitch + dy * 0.004));
  ultimoX = x; ultimoY = y;
}
function fineTocco(x, y) {
  if (!gestoIniziatoSulCanvas) return;
  gestoIniziatoSulCanvas = false;
  trascinando = false;
  if (document.getElementById("velo").classList.contains("attivo")) return;
  if (!mosso) gestisciClick(x, y);
}

canvas.addEventListener("mousedown", e => inizioTocco(e.clientX, e.clientY));
canvas.addEventListener("mousemove", e => muoviTocco(e.clientX, e.clientY));
addEventListener("mouseup", e => fineTocco(e.clientX, e.clientY));

canvas.addEventListener("touchstart", e => { const t = e.touches[0]; inizioTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchmove", e => { const t = e.touches[0]; muoviTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchend", e => { const t = e.changedTouches[0]; fineTocco(t.clientX, t.clientY); });

function gestisciClick(x, y) {
  const oggetto = pickOggetto(x, y);
  if (oggetto) {
    const posMondo = new THREE.Vector3();
    oggetto.getWorldPosition(posMondo);
    const distanza = camera.position.distanceTo(posMondo);
    if (distanza <= RAGGIO_INTERAZIONE) {
      apriInterazione(oggetto);
    } else {
      mostraSuggerimento("Avvicinati per interagire");
    }
    return;
  }
  const punto = pickGroundAt(x, y);
  if (punto) {
    const valido = risolviPosizioneValida(punto.x, punto.z);
    target = new THREE.Vector3(valido.x, ALTEZZA_OCCHI, valido.z);
    inMovimento = true;
  }
}

function mostraSuggerimento(testo) {
  const el = document.getElementById("suggerimento");
  el.textContent = testo;
  el.classList.add("attivo");
  clearTimeout(window._tSuggerimento);
  window._tSuggerimento = setTimeout(() => el.classList.remove("attivo"), 1400);
}

/* ══════════════════════════════════════════
   LOOP DI RENDER
   ══════════════════════════════════════════ */
function anima() {
  requestAnimationFrame(anima);

  if (inMovimento) {
    camera.position.lerp(target, 0.045);
    if (camera.position.distanceTo(target) < 0.05) inMovimento = false;
  }

  // corregge SEMPRE la posizione reale, non solo il punto di destinazione:
  // se il tragitto in linea retta verso il target attraverserebbe un
  // ostacolo, qui viene respinta fuori ad ogni fotogramma
  const posValida = risolviPosizioneValida(camera.position.x, camera.position.z);
  camera.position.x = posValida.x;
  camera.position.z = posValida.z;

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const intensita = 0.25 + 0.15 * Math.sin(performance.now() * 0.003);
  materialiPulsanti.forEach(m => { m.emissiveIntensity = intensita; });

  const t = performance.now() * 0.001;
  fiamme.forEach(f => {
    const tremolio = f.base * (0.82 + 0.18 * Math.sin(t * 9 + f.seme) + 0.06 * Math.sin(t * 23 + f.seme));
    f.materiale.emissiveIntensity = tremolio;
    if (f.luce) f.luce.intensity = f.luceBase * (0.8 + 0.2 * Math.sin(t * 9 + f.seme));
  });

  cardinePorta.rotation.y += (portaTargetAngolo - cardinePorta.rotation.y) * 0.06;

  tutTraccia();
  renderer.render(scene, camera);
}
anima();

/* ══════════════════════════════════════════
   AVVIO — carica stato condiviso e attiva realtime
   ══════════════════════════════════════════ */
function tutAvvia() {
  window._popupBloccato = false;
  chiudiPopup();
  tut.t0 = Date.now();
}

async function avviaStanza() {
  mostraPopup(`<div class="nome">― Caricamento ―</div><div class="testo corsivo">Sto entrando nella partita ${CODICE_PARTITA}…</div>`);
  await caricaStatoRemoto();
  registraIngressoStanza();
  if (serraturaSbloccata(STANZA_ID)) { impostaPorta(true, true); attivaPorta(); }
  iscrivitiAggiornamenti();
  chiudiPopup();
  iniettaControlliFissi(null);
  setInterval(() => tutTick(), 500);

  // chi ha già completato il tutorial (es. ricarica della pagina) non lo rifà
  if (sessionStorage.getItem("tutorialFatto_" + CODICE_PARTITA)) {
    ["mov", "int", "tac"].forEach(q => tut.fase[q] = "chiusa");
    tut.completato = true;
    impostaPorta(true, true); attivaPorta();
    return;
  }
  if (!sessionStorage.getItem("introVista_" + CODICE_PARTITA)) {
    sessionStorage.setItem("introVista_" + CODICE_PARTITA, "1");
    window._popupBloccato = true;
    mostraPopup(`
      <div class="nome">― Il Castello di Roccabruna ―</div>
      <div class="testo" style="font-style:normal;text-align:left">
        È sera. Siete entrati nel vecchio castello di Roccabruna, dove si dice sia custodito un tesoro.
        Per raggiungerlo dovrete attraversare le sue sale, una dopo l'altra, e trovare in ciascuna
        la risposta che apre la porta successiva.<br><br>
        Cominciate dall'atrio: guardatevi intorno.<br><br>
        <i>Parlatevi: da soli non si esce.</i>
      </div>
      <div class="bottoni"><button class="si" onclick="tutAvvia()">Cominciamo</button></div>
    `);
  } else {
    tutAvvia();
  }
}

document.addEventListener("DOMContentLoaded", avviaStanza);
</script>
