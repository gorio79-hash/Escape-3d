body { background:#000; overflow:hidden; font-family:Palatino,Georgia,serif; }

<script>

/* ══════════════════════════════════════════
   CONNESSIONE SUPABASE E STATO CONDIVISO
   (identico alle altre stanze: stessa tabella,
   stessa logica di salvataggio/realtime)
   ══════════════════════════════════════════ */

const SUPABASE_URL = "https://vozzdhpwiauchvznfvsi.supabase.co";
const SUPABASE_KEY = "sb_publishable_aLZfS_idBIXD1mEixlnGsA_FF70VGni";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CODICE_PARTITA = sessionStorage.getItem("codicePartita");

let statoLocale = { indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
let statoCaricato = false;

async function caricaStatoRemoto() {
  const { data, error } = await sb.from("partite").select("*").eq("codice", CODICE_PARTITA).maybeSingle();
  if (!data) {
    const nuova = { codice: CODICE_PARTITA, indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
    await sb.from("partite").insert(nuova);
    statoLocale = nuova;
  } else {
    statoLocale = data;
    if (!statoLocale.messaggi) statoLocale.messaggi = [];
  }
  statoCaricato = true;
}

async function salvaStatoRemoto() {
  const { codice, indizi, risposte, serrature_sbloccate, messaggi } = statoLocale;
  await sb.from("partite").update({ indizi, risposte, serrature_sbloccate, messaggi,
    aggiornato_il: new Date().toISOString() }).eq("codice", codice);
}

function iscrivitiAggiornamenti() {
  sb.channel("partita-" + CODICE_PARTITA)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "partite", filter: `codice=eq.${CODICE_PARTITA}` },
      payload => {
        statoLocale = payload.new;
        if (!statoLocale.messaggi) statoLocale.messaggi = [];
        aggiornaFeedTaccuino();
        if (typeof STANZA_ID !== "undefined" && typeof impostaPorta === "function"
            && serraturaSbloccata(STANZA_ID)) {
          impostaPorta(true);
        }
      })
    .subscribe();
}

function aggiungiIndizio(id, testo, stanza) {
  if (!statoLocale.indizi.find(i => i.id === id)) {
    statoLocale.indizi.push({ id, testo, stanza, quando: Date.now() });
    salvaStatoRemoto();
  }
}
function serraturaSbloccata(stanzaId) {
  return statoLocale.serrature_sbloccate.includes(stanzaId);
}
function sbloccaSerratura(stanzaId) {
  if (!statoLocale.serrature_sbloccate.includes(stanzaId)) {
    statoLocale.serrature_sbloccate.push(stanzaId);
    const r = statoLocale.risposte = statoLocale.risposte || {};
    r.tempi = r.tempi || {};
    r.tempi[stanzaId] = Object.assign(r.tempi[stanzaId] || {}, { fine: Date.now() });
    salvaStatoRemoto();
  }
}
function registraIngressoStanza() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.tempi = r.tempi || {};
  if (!r.tempi[STANZA_ID]) { r.tempi[STANZA_ID] = { inizio: Date.now() }; salvaStatoRemoto(); }
}
function registraErrore() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.errori = r.errori || {};
  r.errori[STANZA_ID] = (r.errori[STANZA_ID] || 0) + 1;
  salvaStatoRemoto();
}


function escapeHtml(str) {
  return (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ══════════════════════════════════════════
   POPUP
   ══════════════════════════════════════════ */
function mostraPopup(html) {
  document.getElementById("popup").innerHTML = html;
  document.getElementById("velo").classList.add("attivo");
}
function chiudiPopup() {
  document.getElementById("velo").classList.remove("attivo");
  document.getElementById("popup").innerHTML = "";
  document.getElementById("popup").classList.remove("largo", "enorme");
}
document.addEventListener("DOMContentLoaded", () => {
  const velo = document.getElementById("velo");
  velo.addEventListener("click", e => { if (e.target === velo) chiudiPopup(); });
});

/* ══════════════════════════════════════════
   TACCUINO CONDIVISO
   ══════════════════════════════════════════ */
function costruisciFeedHtml() {
  const voci = [
    ...statoLocale.indizi.map(i => ({ tipo:"indizio", testo:`${i.stanza} — ${i.testo}`, quando:i.quando||0 })),
    ...(statoLocale.messaggi||[]).map(m => ({ tipo:"messaggio", testo:m.testo, quando:m.quando||0 }))
  ].sort((a,b) => a.quando - b.quando);

  if (!voci.length) return `<div class="testo corsivo">Ancora nessun indizio né messaggio.</div>`;

  return voci.map(v => `
    <div class="voce-feed ${v.tipo}">
      <span class="etichetta-feed">${v.tipo === "indizio" ? "📖" : "💬"}</span>${escapeHtml(v.testo)}
    </div>
  `).join("");
}

function aggiornaFeedTaccuino() {
  const el = document.getElementById("listaFeed");
  if (!el) return;
  el.innerHTML = costruisciFeedHtml();
  el.scrollTop = el.scrollHeight;
}

function apriTaccuino() {
  mostraPopup(`
    <div class="nome">― Taccuino condiviso ―</div>
    <div class="taccuino-feed" id="listaFeed">${costruisciFeedHtml()}</div>
    <div class="input-messaggio-riga">
      <input type="text" id="inputMessaggio" placeholder="Scrivi un messaggio…"
        onkeydown="if(event.key==='Enter')inviaMessaggio()">
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
    <div class="bottoni" style="margin-top:16px"><button class="si" onclick="chiudiPopup()">Chiudi</button></div>
  `);
  setTimeout(() => {
    const el = document.getElementById("listaFeed");
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function inviaMessaggio() {
  const input = document.getElementById("inputMessaggio");
  const testo = input.value.trim();
  if (!testo) return;
  if (!statoLocale.messaggi) statoLocale.messaggi = [];
  statoLocale.messaggi.push({ testo, quando: Date.now() });
  input.value = "";
  salvaStatoRemoto();
  aggiornaFeedTaccuino();
}

function iniettaControlliFissi(stanzaPrecedenteUrl) {
  const div = document.createElement("div");
  div.innerHTML = `
    <button id="btnIndietro" class="controllo-fisso sinistra" title="Torna indietro">←</button>
    <button id="btnTaccuino" class="controllo-fisso destra" title="Taccuino">📒</button>
    <div class="badge-codice">Partita: ${CODICE_PARTITA}</div>
  `;
  document.body.appendChild(div);
  const btnIndietro = document.getElementById("btnIndietro");
  if (stanzaPrecedenteUrl) {
    btnIndietro.addEventListener("click", () => { window.location.href = stanzaPrecedenteUrl; });
  } else {
    btnIndietro.disabled = true;
  }
  document.getElementById("btnTaccuino").addEventListener("click", apriTaccuino);
}

function idYoutube(u) {
  u = (u || "").trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function htmlMedia(m, alt, piccolo) {
  const id = idYoutube(m.url);
  if (!id) return `<div class="segnaposto">${alt}<br><small>(inserire l'URL YouTube in MEDIA)</small></div>`;
  let q = "autoplay=1&rel=0&playsinline=1&modestbranding=1";
  if (m.inizio) q += "&start=" + m.inizio;
  if (m.fine) q += "&end=" + m.fine;
  return `<div class="video-wrap${piccolo ? " piccolo" : ""}"><iframe
      src="https://www.youtube-nocookie.com/embed/${id}?${q}"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="suggerimento-testo"><a href="https://www.youtube.com/watch?v=${id}" target="_blank"
      rel="noopener" style="color:inherit">Se non parte, aprilo su YouTube</a></div>`;
}
function mostraPopupLargo(html) {
  mostraPopup(html);
  document.getElementById("popup").classList.add("largo");
}

/* promemoria che finisce nel taccuino condiviso quando la squadra visita una postazione */
const INDIZI_STANZA = {
  storia:      { id: "s3_storia",      testo: "Le immagini incorniciate alla parete: che parola ci fanno venire in mente?" },
  fish:        { id: "s3_fish",        testo: "Il filmato sul televisore accanto all'acquario: che parola ci fa venire in mente?" },
  vita:        { id: "s3_vita",        testo: "Le tre canzoni del jukebox: che parola ci fanno venire in mente?" },
  incredibile: { id: "s3_incredibile", testo: "La scena del proiettore: che parola ci fa venire in mente?" },
  big:         { id: "s3_big",         testo: "Il cartoncino della macchina dei desideri: che parola ci fa venire in mente?" }
};
function segnaVisita(chiave) {
  const d = INDIZI_STANZA[chiave];
  aggiungiIndizio(d.id, d.testo, STANZA_ID);
}

function apriStoria(i) {
  i = ((i || 0) + MEDIA.storia.length) % MEDIA.storia.length;
  segnaVisita("storia");
  mostraPopupLargo(`
    <div class="nome">― Le cornici (${i + 1}/${MEDIA.storia.length}) ―</div>
    <img src="${MEDIA.storia[i]}" alt="Immagine ${i + 1}" class="img-indizio">
    <div class="testo corsivo" style="margin-top:12px">Tre immagini, appese l'una accanto all'altra. Qualcosa le lega.</div>
    <div class="bottoni">
      <button class="si" onclick="apriStoria(${i - 1})">← Precedente</button>
      <button class="si" onclick="apriStoria(${i + 1})">Successiva →</button>
      <button class="no" onclick="chiudiPopup()">Chiudi</button>
    </div>
  `);
  document.getElementById("popup").classList.add("enorme");
}
function apriFish() {
  segnaVisita("fish");
  mostraPopupLargo(`
    <div class="nome">― Il televisore ―</div>
    <div class="testo corsivo">Lo schermo si accende da solo. Parte un filmato.</div>
    ${htmlMedia(MEDIA.fish, "Filmato del televisore")}
    <div class="bottoni" style="margin-top:10px"><button class="si" onclick="chiudiPopup()">Chiudi</button></div>

function caricaApiYT(cb) {
  if (window.YT && YT.Player) { cb(); return; }

  if (!document.getElementById("ytApi")) {

function suonaDisco(n) {
  const m = [MEDIA.canzoneA, MEDIA.canzoneB, MEDIA.canzoneC][n - 1];

  statoDisco("Disco " + n + "…");
  try {

  } catch (e) { statoDisco("Errore nel lettore.", true); return; }
  clearTimeout(ytTimer);
  ytTimer = setTimeout(() => {
    if (ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() !== 1)
      statoDisco("Il browser non fa partire l'audio da solo: tocca ancora il disco.", true);

function creaTexturaPietra() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const cella = 32;
  const toniChiari = ["#9a9484", "#8f8878"];
  const toniScuri = ["#6f6a5c", "#645f52"];
  for (let y = 0; y < size; y += cella) {
    for (let x = 0; x < size; x += cella) {
      const scacco = ((x / cella) + (y / cella)) % 2 === 0;
      const toni = scacco ? toniChiari : toniScuri;
      ctx.fillStyle = toni[Math.floor(Math.random() * toni.length)];
      ctx.fillRect(x, y, cella, cella);
    }
  }
  ctx.strokeStyle = "rgba(20,15,10,0.35)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= size; i += cella) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(STANZA_LATO / 3, STANZA_LATO / 3);
  return texture;
}

function creaTexturaSchermo() {
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 272;
  const c = cv.getContext("2d");
  const g = c.createRadialGradient(256, 136, 20, 256, 136, 300);
  g.addColorStop(0, "#F4F6FA"); g.addColorStop(1, "#B9C2CF");
  c.fillStyle = g; c.fillRect(0, 0, 512, 272);
  c.strokeStyle = "rgba(90,100,120,.25)"; c.lineWidth = 3;
  c.beginPath(); c.arc(256, 136, 70, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.moveTo(256, 40); c.lineTo(256, 232); c.moveTo(160, 136); c.lineTo(352, 136); c.stroke();
  return new THREE.CanvasTexture(cv);
}

const oggettiInterattivi = [];
const materialiPulsanti = [];
function registraInterattivo(mesh, dati, coloreEmissivo) {
  mesh.userData.interagibile = true;
  Object.assign(mesh.userData, dati);
  oggettiInterattivi.push(mesh);
  const materiali = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  materiali.forEach(m => {
    if (m && "emissive" in m) {
      m.emissive = new THREE.Color(coloreEmissivo || 0xC48A28);
      m.emissiveIntensity = 0.25;
      materialiPulsanti.push(m);
    }
  });
}
const RAGGIO_GIOCATORE = 0.45;
const fiamme = [];
function registraFiamma(materiale, intensitaBase, luce) {
  fiamme.push({ materiale, base: intensitaBase, luce: luce || null, luceBase: luce ? luce.intensity : 0, seme: Math.random() * 100 });
}
const MARGINE_PARETE = 1.3;
const ingombri = [];
function registraIngombro(oggetto3D, margineExtra = RAGGIO_GIOCATORE) {
  oggetto3D.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(oggetto3D);
  ingombri.push({ minX: box.min.x - margineExtra, maxX: box.max.x + margineExtra, minZ: box.min.z - margineExtra, maxZ: box.max.z + margineExtra });
}
function risolviPosizioneValida(x, z) {
  let px = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, x));
  let pz = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, z));
  ingombri.forEach(r => {
    if (px > r.minX && px < r.maxX && pz > r.minZ && pz < r.maxZ) {
      const distSx = px - r.minX, distDx = r.maxX - px, distSu = pz - r.minZ, distGiu = r.maxZ - pz;
      const minDist = Math.min(distSx, distDx, distSu, distGiu);
      if (minDist === distSx) px = r.minX;
      else if (minDist === distDx) px = r.maxX;
      else if (minDist === distSu) pz = r.minZ;
      else pz = r.maxZ;
    }
  });
  return { x: px, z: pz };
}

   PORTE — convenzione unica per tutta la stanza: ogni oggetto
   montato a parete usa un offset locale POSITIVO in z per sporgere
   verso l'interno della stanza; la ry di montaggio si occupa di
   orientare correttamente ciascuna parete (nord/sud/est/ovest).
   ══════════════════════════════════════════ */
function creaPorta(zMuro, ry, dati) {
  const gruppo = new THREE.Group();
  gruppo.position.set(0, 0, zMuro);
  gruppo.rotation.y = ry;
  scene.add(gruppo);

  // cardine verticale sul bordo della porta — ruotandolo si anima
  // l'apertura (usato solo per la porta con serratura, vedi sotto)
  const cardine = new THREE.Group();
  cardine.position.set(-0.7, ALTEZZA_PORTA / 2, 0.12);
  gruppo.add(cardine);

  const porta = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, ALTEZZA_PORTA, 0.15),
    new THREE.MeshStandardMaterial({ color: 0x3a2412 })
  );
  porta.position.set(0.7, 0, 0);
  cardine.add(porta);
  registraInterattivo(porta, dati);

  const maniglia = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.12, 0.12),
    new THREE.MeshStandardMaterial({ color: 0xC48A28 })
  );
  maniglia.position.set(1.2, 0, 0.08);
  cardine.add(maniglia);

  return { gruppo, cardine };
}

let yaw = Math.PI, pitch = 0;
let trascinando = false, ultimoX = 0, ultimoY = 0, mosso = false;
let gestoIniziatoSulCanvas = false;

const canvas = document.getElementById("canvas3d");

function inizioTocco(x, y) {
  gestoIniziatoSulCanvas = true;
  trascinando = true; mosso = false; ultimoX = x; ultimoY = y;
}
function muoviTocco(x, y) {
  if (!trascinando) return;
  const dx = x - ultimoX, dy = y - ultimoY;
  if (Math.abs(dx) + Math.abs(dy) > 6) mosso = true;
  yaw += dx * 0.004;
  pitch = Math.max(-1, Math.min(1, pitch + dy * 0.004));
  ultimoX = x; ultimoY = y;
}
function fineTocco(x, y) {
  if (!gestoIniziatoSulCanvas) return;
  gestoIniziatoSulCanvas = false;
  trascinando = false;
  if (document.getElementById("velo").classList.contains("attivo")) return;
  if (!mosso) gestisciClick(x, y);
}

canvas.addEventListener("mousedown", e => inizioTocco(e.clientX, e.clientY));
canvas.addEventListener("mousemove", e => muoviTocco(e.clientX, e.clientY));
addEventListener("mouseup", e => fineTocco(e.clientX, e.clientY));

canvas.addEventListener("touchstart", e => { const t = e.touches[0]; inizioTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchmove", e => { const t = e.touches[0]; muoviTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchend", e => { const t = e.changedTouches[0]; fineTocco(t.clientX, t.clientY); });

function gestisciClick(x, y) {
  const oggetto = pickOggetto(x, y);
  if (oggetto) {
    const posMondo = new THREE.Vector3();
    oggetto.getWorldPosition(posMondo);
    const distanza = camera.position.distanceTo(posMondo);
    if (distanza <= RAGGIO_INTERAZIONE) {
      apriInterazione(oggetto);
    } else {
      mostraSuggerimento("Avvicinati per interagire");
    }
    return;
  }
  const punto = pickGroundAt(x, y);
  if (punto) {
    const valido = risolviPosizioneValida(punto.x, punto.z);
    target = new THREE.Vector3(valido.x, ALTEZZA_OCCHI, valido.z);
    inMovimento = true;
  }
}

function mostraSuggerimento(testo) {
  const el = document.getElementById("suggerimento");
  el.textContent = testo;
  el.classList.add("attivo");
  clearTimeout(window._tSuggerimento);
  window._tSuggerimento = setTimeout(() => el.classList.remove("attivo"), 1400);
}

/* ══════════════════════════════════════════
   LOOP DI RENDER
   ══════════════════════════════════════════ */
function anima() {
  requestAnimationFrame(anima);

  if (inMovimento) {
    camera.position.lerp(target, 0.045);
    if (camera.position.distanceTo(target) < 0.05) inMovimento = false;
  }

  const posValida = risolviPosizioneValida(camera.position.x, camera.position.z);
  camera.position.x = posValida.x;
  camera.position.z = posValida.z;

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const intensita = 0.25 + 0.15 * Math.sin(performance.now() * 0.003);
  materialiPulsanti.forEach(m => { m.emissiveIntensity = intensita; });

  const t = performance.now() * 0.001;
  fiamme.forEach(f => {
    const tremolio = f.base * (0.82 + 0.18 * Math.sin(t * 9 + f.seme) + 0.06 * Math.sin(t * 23 + f.seme));
    f.materiale.emissiveIntensity = tremolio;
    if (f.luce) f.luce.intensity = f.luceBase * (0.8 + 0.2 * Math.sin(t * 9 + f.seme));
  });

  pesci.forEach(p => {
    const u = Math.sin(t * p.vel + p.fase);
    p.g.position.set(p.off + u * 0.35, p.y + Math.sin(t * 0.7 + p.fase) * 0.08, p.dz);
    p.g.rotation.y = Math.cos(t * p.vel + p.fase) > 0 ? 0 : Math.PI;
  });
  matSchermo.color.setScalar(0.9 + 0.05 * Math.sin(t * 13) + 0.03 * Math.sin(t * 31));
  matRaggio.opacity = 0.035 + 0.008 * Math.sin(t * 17);

  cardinePortaUscita.rotation.y += (portaTargetAngolo - cardinePortaUscita.rotation.y) * 0.06;

  renderer.render(scene, camera);
}
anima();

/* ══════════════════════════════════════════
   AVVIO
   ══════════════════════════════════════════ */
async function avviaStanza() {
  mostraPopup(`<div class="nome">― Caricamento ―</div><div class="testo corsivo">Sto entrando nella partita ${CODICE_PARTITA}…</div>`);
  await caricaStatoRemoto();
  registraIngressoStanza();
  if (serraturaSbloccata(STANZA_ID)) impostaPorta(true, true);
  iscrivitiAggiornamenti();
  chiudiPopup();
  iniettaControlliFissi("stanza2quadri.html");
}

document.addEventListener("DOMContentLoaded", avviaStanza);
