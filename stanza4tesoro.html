<style>

body { background:#000; overflow:hidden; font-family:Palatino,Georgia,serif; }

#popup .corsivo { font-style:italic; opacity:.7; }

#popup button, #popup .opzione {
  padding:9px 22px; font-family:inherit; font-size:15px; cursor:pointer;
  border-radius:3px; color:var(--cream); background:#241506; border:1px solid var(--gold);

.taccuino-feed { max-height:280px; overflow-y:auto; text-align:left; margin-bottom:12px; }

  color:var(--cream); font-family:inherit; font-size:14px;
}

  padding:10px 16px; background:#382010; border:2px solid var(--gold); border-radius:4px;
  color:var(--cream); cursor:pointer; font-family:inherit;
}

.controllo-fisso {
  position:fixed; top:18px; z-index:150; width:46px; height:46px; border-radius:50%;

.inputEnigmaStyle {

.btnCopia { margin-top:10px; padding:7px 18px; font-family:Palatino,Georgia,serif; font-size:13px; cursor:pointer; border-radius:3px; background:#1A2018; color:var(--cream); border:1px solid var(--gold); letter-spacing:.04em; }
.btnCopia:hover { background:#253022; }
.btnTorna { padding:9px 22px; font-family:Palatino,Georgia,serif; font-size:15px; cursor:pointer; border-radius:3px; background:#382010; color:var(--cream); border:2px solid var(--gold); letter-spacing:.04em; }

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>

/* ══════════════════════════════════════════
   CONNESSIONE SUPABASE E STATO CONDIVISO
   (identico alle altre stanze — qui, a differenza del file
   originale "tesoro.html" che era single-player con stato in
   localStorage/URL, la stanza finale è collegata al gruppo come
   le altre: chi esplora aggiunge indizi condivisi, chi risolve
   il baule lo apre per tutti)
   ══════════════════════════════════════════ */

const SUPABASE_URL = "https://vozzdhpwiauchvznfvsi.supabase.co";
const SUPABASE_KEY = "sb_publishable_aLZfS_idBIXD1mEixlnGsA_FF70VGni";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CODICE_PARTITA = sessionStorage.getItem("codicePartita");

let statoLocale = { indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
let statoCaricato = false;

async function caricaStatoRemoto() {
  const { data, error } = await sb.from("partite").select("*").eq("codice", CODICE_PARTITA).maybeSingle();
  if (!data) {
    const nuova = { codice: CODICE_PARTITA, indizi: [], risposte: {}, serrature_sbloccate: [], messaggi: [] };
    await sb.from("partite").insert(nuova);
    statoLocale = nuova;
  } else {
    statoLocale = data;
    if (!statoLocale.messaggi) statoLocale.messaggi = [];
  }
  statoCaricato = true;
}

async function salvaStatoRemoto() {
  const { codice, indizi, risposte, serrature_sbloccate, messaggi } = statoLocale;
  await sb.from("partite").update({ indizi, risposte, serrature_sbloccate, messaggi,
    aggiornato_il: new Date().toISOString() }).eq("codice", codice);
}

function iscrivitiAggiornamenti() {
  sb.channel("partita-" + CODICE_PARTITA)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "partite", filter: `codice=eq.${CODICE_PARTITA}` },
      payload => {
        statoLocale = payload.new;
        if (!statoLocale.messaggi) statoLocale.messaggi = [];
        aggiornaFeedTaccuino();
        if (typeof STANZA_ID !== "undefined" && typeof impostaCoperchio === "function"
            && serraturaSbloccata(STANZA_ID)) {
          impostaCoperchio(true);
        }
      })
    .subscribe();
}

function aggiungiIndizio(id, testo, stanza) {
  if (!statoLocale.indizi.find(i => i.id === id)) {
    statoLocale.indizi.push({ id, testo, stanza, quando: Date.now() });
    salvaStatoRemoto();
  }
}
function serraturaSbloccata(stanzaId) {
  return statoLocale.serrature_sbloccate.includes(stanzaId);
}
function sbloccaSerratura(stanzaId) {
  if (!statoLocale.serrature_sbloccate.includes(stanzaId)) {
    statoLocale.serrature_sbloccate.push(stanzaId);
    const r = statoLocale.risposte = statoLocale.risposte || {};
    r.tempi = r.tempi || {};
    r.tempi[stanzaId] = Object.assign(r.tempi[stanzaId] || {}, { fine: Date.now() });
    salvaStatoRemoto();
  }
}
function registraIngressoStanza() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.tempi = r.tempi || {};
  if (!r.tempi[STANZA_ID]) { r.tempi[STANZA_ID] = { inizio: Date.now() }; salvaStatoRemoto(); }
}
function registraErrore() {
  const r = statoLocale.risposte = statoLocale.risposte || {};
  r.errori = r.errori || {};
  r.errori[STANZA_ID] = (r.errori[STANZA_ID] || 0) + 1;
  salvaStatoRemoto();
}


function escapeHtml(str) {
  return (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ══════════════════════════════════════════
   POPUP / TACCUINO — identici alle altre stanze
   ══════════════════════════════════════════ */
function mostraPopup(html) {
  document.getElementById("popup").innerHTML = html;
  document.getElementById("velo").classList.add("attivo");
}
function chiudiPopup() {
  document.getElementById("velo").classList.remove("attivo");
  document.getElementById("popup").innerHTML = "";
}
document.addEventListener("DOMContentLoaded", () => {
  const velo = document.getElementById("velo");
  velo.addEventListener("click", e => { if (e.target === velo) chiudiPopup(); });
});

function costruisciFeedHtml() {
  const voci = [
    ...statoLocale.indizi.map(i => ({ tipo:"indizio", testo:`${i.stanza} — ${i.testo}`, quando:i.quando||0 })),
    ...(statoLocale.messaggi||[]).map(m => ({ tipo:"messaggio", testo:m.testo, quando:m.quando||0 }))
  ].sort((a,b) => a.quando - b.quando);
  if (!voci.length) return `<div class="testo corsivo">Ancora nessun indizio né messaggio.</div>`;
  return voci.map(v => `
    <div class="voce-feed ${v.tipo}">
      <span class="etichetta-feed">${v.tipo === "indizio" ? "📖" : "💬"}</span>${escapeHtml(v.testo)}
    </div>
  `).join("");
}
function aggiornaFeedTaccuino() {
  const el = document.getElementById("listaFeed");
  if (!el) return;
  el.innerHTML = costruisciFeedHtml();
  el.scrollTop = el.scrollHeight;
}
function apriTaccuino() {
  mostraPopup(`
    <div class="nome">― Taccuino condiviso ―</div>
    <div class="taccuino-feed" id="listaFeed">${costruisciFeedHtml()}</div>
    <div class="input-messaggio-riga">
      <input type="text" id="inputMessaggio" placeholder="Scrivi un messaggio…"
        onkeydown="if(event.key==='Enter')inviaMessaggio()">
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
    <div class="bottoni" style="margin-top:16px"><button class="si" onclick="chiudiPopup()">Chiudi</button></div>
  `);
  setTimeout(() => {
    const el = document.getElementById("listaFeed");
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}
function inviaMessaggio() {
  const input = document.getElementById("inputMessaggio");
  const testo = input.value.trim();
  if (!testo) return;
  if (!statoLocale.messaggi) statoLocale.messaggi = [];
  statoLocale.messaggi.push({ testo, quando: Date.now() });
  input.value = "";
  salvaStatoRemoto();
  aggiornaFeedTaccuino();
}
function iniettaControlliFissi(stanzaPrecedenteUrl) {
  const div = document.createElement("div");
  div.innerHTML = `
    <button id="btnIndietro" class="controllo-fisso sinistra" title="Torna indietro">←</button>
    <button id="btnTaccuino" class="controllo-fisso destra" title="Taccuino">📒</button>
    <div class="badge-codice">Partita: ${CODICE_PARTITA}</div>
  `;
  document.body.appendChild(div);
  const btnIndietro = document.getElementById("btnIndietro");
  if (stanzaPrecedenteUrl) {
    btnIndietro.addEventListener("click", () => { window.location.href = stanzaPrecedenteUrl; });
  } else {
    btnIndietro.disabled = true;
  }
  document.getElementById("btnTaccuino").addEventListener("click", apriTaccuino);
}

/* ══════════════════════════════════════════
   CONTENUTI STANZA 4 — testi identici al file "tesoro.html"
   originale (pergamene, scrittoio, monete, mobiletto, candele,
   scrigno), tranne zaino e riferimenti a personaggi di altre
   avventure, rimossi su richiesta.
   ══════════════════════════════════════════ */

const STANZA_ID = "stanza4";

// stesso indovinello a lettere nascoste dell'originale: le lettere in
// grassetto, lette in ordine, compongono "INCREDIBILMENTE" — è un vero
// meccanismo di puzzle, non solo narrativo, quindi il testo resta invariato
const TESTO_PERGAMENE = `Questo luogo ha qualcosa d<span class="lettera-nascosta">i</span> speciale che le parole non catturano.<br>
La pietra stessa sembra respirare, se<span class="lettera-nascosta">n</span>za far rumore.<br>
Chi vuole trovare deve imparare a cer<span class="lettera-nascosta">c</span>are in modo diverso.<br>
Ogni anfratto di questo posto cu<span class="lettera-nascosta">r</span>a le proprie memorie.<br>
Qu<span class="lettera-nascosta">e</span>ste stanze ricordano chi è passato prima di te.<br>
Passa un <span class="lettera-nascosta">d</span>ecennio, poi un altro, eppure qualcosa resta uguale.<br>
Il s<span class="lettera-nascosta">i</span>lenzio qui ha il peso delle cose non dette.<br>
Ogni al<span class="lettera-nascosta">b</span>a nuova trova questo posto immutato.<br>
La part<span class="lettera-nascosta">i</span>colarità di questo luogo non si spiega — si sente.<br>
Nu<span class="lettera-nascosta">l</span>la qui è lasciato al caso.<br>
Anni innu<span class="lettera-nascosta">m</span>erevoli di storia silenziosa aspettano di essere letti.<br>
Ciò ch<span class="lettera-nascosta">e</span> sembra ovvio spesso nasconde la risposta.<br>
Questo posto è sempre stato qui, dime<span class="lettera-nascosta">n</span>ticato dal mondo.<br>
Il por<span class="lettera-nascosta">t</span>ale di questa stanza non si apre con una chiave.<br>
Alla fin<span class="lettera-nascosta">e</span>, ciò che conta non è la meta ma il cammino percorso.`;

const TESTI_HOTSPOT = {
  pergamene: { nome:"Pergamene", testo: TESTO_PERGAMENE },
  scrittoio: { nome:"Scrittoio", testo:
    `― DIARIO DI UN SOLDATO, GIORNO IGNOTO ―<br><i>«Stanotte ho tenuto la mano di un compagno per ore. Non c'era niente da dire. Bastava restare lì, così.»</i><br><br>
    ― LETTERA DI UNA MADRE ―<br><i>«Quando piange abbasso la fronte fino a toccare la sua. In quel momento il mondo finisce qui, e basta.»</i><br><br>
    ― NOTA DI UN GUARITORE, SENZA DATA ―<br><i>«Il mio lavoro non è curare. È stare. Non davanti, non dietro. In quel posto esatto dove l'altro può sentirti senza cercarti.»</i><br><br>
    <span style="opacity:.7">Tre voci. Una sola parola le descrive tutte.</span>` },
  monete: { nome:"Monete", testo:
    `Le monete più antiche portano incisa la stessa parola su ogni faccia. I mercanti la usavano per il primo affare, il più importante, quello che non si sbagliava.<br><br>
    Su una moneta consumata, quasi illeggibile:<br><br>
    <i>«Più del normale. Più di tanto. Una quercia lo è, rispetto a un seme. Un'impresa lo è, quando lascia il segno. Chi sono?»</i>` },
  mobiletto: { nome:"Mobiletto", testo:
    `Nel cassetto più in basso, un biglietto sgualcito.<br><br>
    <i>«Sono nel grido di chi chiama aiuto nel buio. Sono nel vento che piega gli alberi ma non li spezza. Sono il nome che dai alle mura che proteggono e alla nota più alta che una campana può fare. Mi trovi nel castello e nel pugno chiuso, nella voce di chi non ha paura e nella roccia che non cede.<br><br>Chi sono?»</i>` },
  candele: { nome:"Candele", testo:
    `Tra le candele, un leggio con un frammento di partitura. Qualcuno studiava musica in questa stanza — o forse la ascoltava soltanto.<br><br>
    Una parola che i musicisti conoscono bene.<br><br>
    <i>«Non poco, non abbastanza. Questa.»</i>` },
};

const SCRIGNO_ISCRIZIONE =
  `Inciso intorno alla serratura:<br><br><i>«Aprimi con quello che hai imparato, non con quello che hai trovato.»</i><br><br>
  Più in basso, in caratteri più piccoli:<br><br>
  <i>«Quattro parole possono essere una via alternativa, se non trovi la parola che tutto apre. Mettile insieme per costruire il titolo di un'opera di finzione moderna.»</i>`;

// le due risposte accettate, invariate rispetto all'originale
const RISPOSTA_A = "molto forte incredibilmente vicino";
const RISPOSTA_C = "imparato";

function normalizza(s) {
  return s.trim().toLowerCase().replace(/[,;:!?.«»""'']/g, "").replace(/\s+/g, " ");
}

// soglia di esplorazione condivisa: come nell'originale, serve aver
// esplorato almeno metà degli elementi (esclusi lo scrigno) prima che
// lo scrigno accetti una risposta — qui però il conteggio è di gruppo,
// riusando gli stessi indizi condivisi del taccuino
const HOTSPOT_ID_PISTA = ["pergamene", "scrittoio", "monete", "mobiletto", "candele"];
function hotspotVisitatiCount() {
  return HOTSPOT_ID_PISTA.filter(id => statoLocale.indizi.some(i => i.id === id)).length;
}
function sogliaDiVisita() { return Math.floor(HOTSPOT_ID_PISTA.length / 2); }

function apriHotspotNarrativo(id) {
  const h = TESTI_HOTSPOT[id];
  aggiungiIndizio(id, `${h.nome} osservato`, STANZA_ID);
  mostraPopup(`
    <div class="pagina-libro">
      <div class="intestazione-pagina">${h.nome}</div>
      <div class="domanda-testo">${h.testo}</div>
      <button class="chiudi-pagina" onclick="chiudiPopup()">Chiudi</button>
    </div>
  `);
}

/* ── STATO LOCALE DI SESSIONE (per il report finale — personale,
   non condiviso: ognuno vede le proprie statistiche di gioco, come
   nell'originale) ── */

let clickTotali = 0;
let inizioSessione = Date.now();

function formatTempo(sec) {
  if (!sec || sec <= 0) return "—";
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m} min ${s} sec` : `${s} sec`;
}

/* ══════════════════════════════════════════
   REPORT FINALE — semplificato rispetto all'originale: niente
   zaino né scelte di altre stanze (non esistono in questo
   progetto), ma stessa logica adattata al gioco attuale:
   esplorazione, gestione dell'errore, percorso alla soluzione.
   ══════════════════════════════════════════ */
const NOMI_SALE = {
  stanza1: "Sala 1 — Biblioteca",
  stanza2: "Sala 2 — Sala dei quadri",
  stanza3: "Sala 3 — Sala di proiezione",
  stanza4: "Sala 4 — Stanza del tesoro"
};
// indizi raccoglibili per sala (per dare un'idea di quanto è stato esplorato)
const TOTALE_INDIZI = { stanza1: 6, stanza2: 6, stanza3: 5, stanza4: 5 };

const breve = n => n.split(' — ')[1].toLowerCase();
function datiPercorso() {
  const r = statoLocale.risposte || {};
  const tempi = r.tempi || {}, errori = r.errori || {};
  const ora = Date.now();
  const sale = Object.keys(NOMI_SALE).map(id => {
    const t = tempi[id] || {};
    const fine = t.fine || (id === STANZA_ID ? ora : null);
    const durata = (t.inizio && fine) ? Math.max(0, Math.round((fine - t.inizio) / 1000)) : 0;
    return {
      id, nome: NOMI_SALE[id], durata,
      errori: errori[id] || 0,
      indizi: statoLocale.indizi.filter(i => i.stanza === id).length,
      totale: TOTALE_INDIZI[id]
    };
  });
  const inizio = tempi.stanza1 && tempi.stanza1.inizio;
  const durataTot = inizio ? Math.round((ora - inizio) / 1000) : sale.reduce((a, s) => a + s.durata, 0);
  return {
    sale, durataTot,
    erroriTot: sale.reduce((a, s) => a + s.errori, 0),
    indiziTot: sale.reduce((a, s) => a + s.indizi, 0),
    totaleIndizi: sale.reduce((a, s) => a + s.totale, 0),
    messaggi: (statoLocale.messaggi || []).length
  };
}

function osservazioni(d, modo) {
  const out = [];
  const perc = d.totaleIndizi ? d.indiziTot / d.totaleIndizi : 0;
  const meno = [...d.sale].sort((a, b) => a.indizi / a.totale - b.indizi / b.totale)[0];
  if (perc >= 0.85)
    out.push(["🔍 Esplorazione", "Il gruppo ha osservato quasi ogni angolo delle sale (" + d.indiziTot + " indizi su " + d.totaleIndizi + "): un'esplorazione accurata, che lascia poco al caso."]);
  else if (perc >= 0.6)
    out.push(["🔍 Esplorazione", "Il gruppo ha osservato la maggior parte degli indizi (" + d.indiziTot + " su " + d.totaleIndizi + "), lasciando da parte qualche angolo — soprattutto nella " + breve(meno.nome) + ". Un'esplorazione mirata più che esaustiva."]);
  else
    out.push(["🔍 Esplorazione", "Il gruppo ha scelto una via essenziale (" + d.indiziTot + " indizi su " + d.totaleIndizi + "), andando dritto a ciò che serviva. Si può riflettere su cosa è stato lasciato indietro e se avrebbe aiutato."]);

  const peggiore = [...d.sale].sort((a, b) => b.errori - a.errori)[0];
  if (d.erroriTot === 0)
    out.push(["🌱 Gestione dell'errore", "Nessun tentativo a vuoto alle serrature: ogni soluzione è arrivata al primo colpo. Vale la pena chiedersi come ci si è accorti di essere pronti."]);
  else if (d.erroriTot <= 5)
    out.push(["🌱 Gestione dell'errore", "Qualche tentativo sbagliato lungo il percorso (" + d.erroriTot + ", di più nella " + breve(peggiore.nome) + "). L'errore ha avuto uno spazio contenuto: cosa si è fatto dopo ciascuno di essi?"]);
  else
    out.push(["🌱 Gestione dell'errore", "Parecchi tentativi sbagliati (" + d.erroriTot + ", soprattutto nella " + breve(peggiore.nome) + "). L'errore è stato un compagno di viaggio frequente: come lo ha vissuto il gruppo? Ha spinto a cambiare strategia o a insistere?"]);

  if (d.messaggi === 0)
    out.push(["🤝 Comunicazione", "Nel taccuino condiviso non sono stati scritti messaggi: la comunicazione è passata probabilmente a voce. Come si sono divisi i compiti e le idee?"]);
  else if (d.messaggi <= 5)
    out.push(["🤝 Comunicazione", "Nel taccuino condiviso " + (d.messaggi === 1 ? "è stato scritto 1 messaggio" : "sono stati scritti " + d.messaggi + " messaggi") + ": un uso misurato dello strumento comune, accanto al confronto a voce."]);
  else
    out.push(["🤝 Comunicazione", "Il taccuino condiviso è stato usato spesso (" + d.messaggi + " messaggi): il gruppo ha tenuto traccia insieme di ciò che trovava e pensava."]);

  const lenta = [...d.sale].sort((a, b) => b.durata - a.durata)[0];
  if (lenta && lenta.durata > 0)
    out.push(["⏱ Ritmo", "La sala che ha richiesto più tempo è stata la " + breve(lenta.nome) + " (" + formatTempo(lenta.durata) + "). Cosa la rendeva più difficile o più coinvolgente delle altre?"]);

  out.push(["🧩 Via alla soluzione finale", modo === "completo"
    ? "Il gruppo ha ricostruito il titolo per intero, mettendo insieme gli indizi sparsi nella sala."
    : "Il gruppo ha scelto la via più breve, rispondendo con la parola suggerita dall'iscrizione invece di ricostruire il titolo completo."]);
  return out;
}

  righe.push("IL CASTELLO DI ROCCABRUNA — RESOCONTO DEL PERCORSO");

function creaTexturaPietra() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const cella = 32;
  const toniChiari = ["#8a8474", "#7f7868"];
  const toniScuri = ["#5f5a4c", "#544f42"];
  for (let y = 0; y < size; y += cella) {
    for (let x = 0; x < size; x += cella) {
      const scacco = ((x / cella) + (y / cella)) % 2 === 0;
      const toni = scacco ? toniChiari : toniScuri;
      ctx.fillStyle = toni[Math.floor(Math.random() * toni.length)];
      ctx.fillRect(x, y, cella, cella);
    }
  }
  ctx.strokeStyle = "rgba(10,8,5,0.4)";
  for (let i = 0; i <= size; i += cella) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(STANZA_LATO / 3, STANZA_LATO / 3);
  return texture;
}

function creaTexturaPartitura() {
  const w = 110, h = 80;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#EADFC0";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(40,28,14,0.6)";
  ctx.lineWidth = 1;
  for (let riga = 0; riga < 2; riga++) {
    const y0 = 16 + riga * 32;
    for (let l = 0; l < 5; l++) {
      ctx.beginPath(); ctx.moveTo(8, y0 + l * 5); ctx.lineTo(w - 8, y0 + l * 5); ctx.stroke();
    }
    for (let n = 0; n < 6; n++) {
      const nx = 16 + n * 14 + Math.random() * 4;
      const ny = y0 + Math.random() * 20;
      ctx.fillStyle = "#2A1C0E";
      ctx.beginPath(); ctx.ellipse(nx, ny, 3, 2.3, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(nx + 2.6, ny - 10, 1, 10);
    }
  }
  return new THREE.CanvasTexture(canvas);
}

const MARGINE_ANGOLO = 0.1;

/* sistema interattivi/collisioni — identico alle altre stanze */
const oggettiInterattivi = [];
const materialiPulsanti = [];
function registraInterattivo(mesh, dati) {
  mesh.userData.interagibile = true;
  Object.assign(mesh.userData, dati);
  oggettiInterattivi.push(mesh);
  const materiali = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  materiali.forEach(m => {
    if (m && "emissive" in m) {
      m.emissive = new THREE.Color(0xC48A28);
      m.emissiveIntensity = 0.25;
      materialiPulsanti.push(m);
    }
  });
}
const fiamme = [];
function registraFiamma(materiale, intensitaBase, luce) {
  fiamme.push({ materiale, base: intensitaBase, luce: luce || null, luceBase: luce ? luce.intensity : 0, seme: Math.random() * 100 });
}

const RAGGIO_GIOCATORE = 0.45;
const MARGINE_PARETE = 1.2;
const ingombri = [];
function registraIngombro(oggetto3D, margineExtra = RAGGIO_GIOCATORE) {
  oggetto3D.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(oggetto3D);
  ingombri.push({
    minX: box.min.x - margineExtra, maxX: box.max.x + margineExtra,
    minZ: box.min.z - margineExtra, maxZ: box.max.z + margineExtra
  });
}
function risolviPosizioneValida(x, z) {
  let px = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, x));
  let pz = Math.max(-meta + MARGINE_PARETE, Math.min(meta - MARGINE_PARETE, z));
  ingombri.forEach(r => {
    if (px > r.minX && px < r.maxX && pz > r.minZ && pz < r.maxZ) {
      const distSx = px - r.minX, distDx = r.maxX - px, distSu = pz - r.minZ, distGiu = r.maxZ - pz;
      const minDist = Math.min(distSx, distDx, distSu, distGiu);
      if (minDist === distSx) px = r.minX; else if (minDist === distDx) px = r.maxX;
      else if (minDist === distSu) pz = r.minZ; else pz = r.maxZ;
    }
  });
  return { x: px, z: pz };
}

/* ══════════════════════════════════════════
   AMBIENTAZIONE MATTUTINA — colonne addossate alle pareti, finestre
   fra una colonna e l'altra che affacciano su un'alba luminosa; la luce
   arriva da fuori (raggi di sole + luce di cielo), non da fiaccole.
   ══════════════════════════════════════════ */
function creaTexturaAlba(conSole) {
  const W = 128, H = 160;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#8FC3F0");
  g.addColorStop(0.55, "#D6E8F5");
  g.addColorStop(0.85, "#FFE6B0");
  g.addColorStop(1, "#FFD08A");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (conSole) {
    const rg = c.createRadialGradient(86, 112, 2, 86, 112, 58);
    rg.addColorStop(0, "rgba(255,250,220,1)");
    rg.addColorStop(0.18, "rgba(255,236,170,.95)");
    rg.addColorStop(1, "rgba(255,210,120,0)");
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  }
  // nuvole morbide
  c.fillStyle = "rgba(255,255,255,.75)";
  [[28, 36, 20], [46, 40, 15], [12, 42, 12], [92, 24, 14], [106, 28, 11]].forEach(([x, y, r]) => {
    c.beginPath(); c.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); c.fill();
  });
  // colline lontane
  c.fillStyle = "#8FA67A";
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) c.lineTo(x, 138 + Math.sin(x * 0.07) * 7 + Math.sin(x * 0.19) * 3);
  c.lineTo(W, H); c.closePath(); c.fill();
  c.fillStyle = "#6F8860";
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) c.lineTo(x, 148 + Math.sin(x * 0.11 + 1) * 5);
  c.lineTo(W, H); c.closePath(); c.fill();
  return new THREE.CanvasTexture(cv);
}
const texAlbaSole = creaTexturaAlba(true);
const texAlbaLibera = creaTexturaAlba(false);

function creaTexturaRaggio() {
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 128;
  const c = cv.getContext("2d");
  const g = c.createLinearGradient(0, 128, 0, 0); // basso = vicino alla finestra
  g.addColorStop(0, "rgba(255,236,180,1)");
  g.addColorStop(1, "rgba(255,236,180,0)");
  c.fillStyle = g; c.fillRect(0, 0, 64, 128);
  c.globalCompositeOperation = "destination-in";
  const h = c.createLinearGradient(0, 0, 64, 0);
  h.addColorStop(0, "rgba(0,0,0,0)"); h.addColorStop(0.25, "rgba(0,0,0,1)");
  h.addColorStop(0.75, "rgba(0,0,0,1)"); h.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = h; c.fillRect(0, 0, 64, 128);
  return new THREE.CanvasTexture(cv);
}
const texRaggio = creaTexturaRaggio();

const matTelaioAlba = new THREE.MeshStandardMaterial({ color: 0x4a3420 });
function creaFinestraAlba(x, z, ry, tex) {
  const g = new THREE.Group();
  g.position.set(x, 2.45, z);
  g.rotation.y = ry;
  scene.add(g);
  const telaio = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.1, 0.08), matTelaioAlba);
  g.add(telaio);
  // il "cielo" è autoilluminato (MeshBasicMaterial): è la sorgente di luce visibile
  const vetro = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.8),
    new THREE.MeshBasicMaterial({ map: tex, fog: false }));
  vetro.position.z = -0.05; vetro.rotation.y = Math.PI; // faccia verso l'interno
  g.add(vetro);
  const croceV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.8, 0.05), matTelaioAlba);
  croceV.position.z = -0.06; g.add(croceV);
  [-0.3, 0.3].forEach(yy => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.05), matTelaioAlba);
    b.position.set(0, yy, -0.06); g.add(b);
  });
  const davanzale = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.08, 0.3), matColonnaPietra);
  davanzale.position.set(0, -1.1, -0.1); g.add(davanzale);
  // raggio di sole che scende nella stanza
  const dir = new THREE.Vector3(0, -0.5, -1).normalize();
  const L = 5.4;
  const raggio = new THREE.Mesh(new THREE.PlaneGeometry(1.5, L),
    new THREE.MeshBasicMaterial({
      map: texRaggio, transparent: true, opacity: 0.2, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false
    }));
  raggio.position.copy(dir.clone().multiplyScalar(L / 2 + 0.15));
  raggio.rotation.x = Math.atan2(dir.z, dir.y);
  g.add(raggio);
  return g;
}

const OFF_FIN = 0.16;
const pareti = [
  { col: [-6, 0, 6],       fin: [-3, 3],     pos: a => [a, meta - DIST_COL],  posF: a => [a, meta - OFF_FIN],  ry: 0 },              // sud
  { col: [-6, -2.2, 2.2, 6], fin: [-4.1, 4.1], pos: a => [a, -meta + DIST_COL], posF: a => [a, -meta + OFF_FIN], ry: Math.PI },       // nord (porta al centro)
  { col: [-6, 0, 6],       fin: [-3, 3],     pos: a => [-meta + DIST_COL, a], posF: a => [-meta + OFF_FIN, a], ry: -Math.PI / 2 },  // ovest
  { col: [-6, 0, 6],       fin: [-3, 3],     pos: a => [meta - DIST_COL, a],  posF: a => [meta - OFF_FIN, a],  ry: Math.PI / 2 }    // est
];

  p.col.forEach(a => { const [x, z] = p.pos(a); creaColonnaAParete(x, z, 0); });
  p.fin.forEach((a, i) => { const [x, z] = p.posF(a); creaFinestraAlba(x, z, p.ry, (k + i) % 2 === 0 ? texAlbaSole : texAlbaLibera); });
});

registraInterattivo(coperchioBaule, { nome: "Baule", tipo: "scrigno" });
registraInterattivo(baseBaule, { nome: "Baule", tipo: "scrigno" });

// un piccolo bagliore dorato dentro il baule, visibile solo a coperchio aperto
const luceTesoro = new THREE.PointLight(0xFFDA8A, 0, 3);
luceTesoro.position.set(0, 0.3, 0);
gruppoBaule.add(luceTesoro);

const ANGOLO_COPERCHIO_APERTO = -Math.PI * 0.75;
let coperchioTargetAngolo = 0;
function impostaCoperchio(aperto, immediato) {
  coperchioTargetAngolo = aperto ? ANGOLO_COPERCHIO_APERTO : 0;
  luceTesoro.intensity = aperto ? 0.8 : 0;
  if (immediato) cardineCoperchio.rotation.x = coperchioTargetAngolo;
}

registraIngombro(gruppoBaule, 0.4);

/* ══════════════════════════════════════════
   MOVIMENTO A CLICK
   ══════════════════════════════════════════ */
let target = camera.position.clone();
let inMovimento = false;
const raycaster = new THREE.Raycaster();
const puntatore = new THREE.Vector2();

function pickGroundAt(clientX, clientY) {
  puntatore.x = (clientX / innerWidth) * 2 - 1;
  puntatore.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(puntatore, camera);
  const hit = raycaster.intersectObject(pavimento)[0];
  return hit ? hit.point : null;
}
function pickOggetto(clientX, clientY) {
  puntatore.x = (clientX / innerWidth) * 2 - 1;
  puntatore.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(puntatore, camera);
  const hits = raycaster.intersectObjects(oggettiInterattivi, false);
  return hits[0] ? hits[0].object : null;
}

let yaw = Math.PI, pitch = 0;
let trascinando = false, ultimoX = 0, ultimoY = 0, mosso = false;
let gestoIniziatoSulCanvas = false;
const canvas = document.getElementById("canvas3d");

function inizioTocco(x, y) { gestoIniziatoSulCanvas = true; trascinando = true; mosso = false; ultimoX = x; ultimoY = y; }
function muoviTocco(x, y) {
  if (!trascinando) return;
  const dx = x - ultimoX, dy = y - ultimoY;
  if (Math.abs(dx) + Math.abs(dy) > 6) mosso = true;
  yaw += dx * 0.004;
  pitch = Math.max(-1, Math.min(1, pitch + dy * 0.004));
  ultimoX = x; ultimoY = y;
}
function fineTocco(x, y) {
  if (!gestoIniziatoSulCanvas) return;
  gestoIniziatoSulCanvas = false;
  trascinando = false;
  if (document.getElementById("velo").classList.contains("attivo")) return;
  if (document.getElementById("scTesoro").classList.contains("attivo")) return;
  if (!mosso) gestisciClick(x, y);
}
canvas.addEventListener("mousedown", e => inizioTocco(e.clientX, e.clientY));
canvas.addEventListener("mousemove", e => muoviTocco(e.clientX, e.clientY));
addEventListener("mouseup", e => fineTocco(e.clientX, e.clientY));
canvas.addEventListener("touchstart", e => { const t = e.touches[0]; inizioTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchmove", e => { const t = e.touches[0]; muoviTocco(t.clientX, t.clientY); }, { passive:true });
canvas.addEventListener("touchend", e => { const t = e.changedTouches[0]; fineTocco(t.clientX, t.clientY); });

function gestisciClick(x, y) {
  const oggetto = pickOggetto(x, y);
  if (oggetto) {
    const posMondo = new THREE.Vector3();
    oggetto.getWorldPosition(posMondo);
    const distanza = camera.position.distanceTo(posMondo);
    if (distanza <= RAGGIO_INTERAZIONE) apriInterazione(oggetto);
    else mostraSuggerimento("Avvicinati per interagire");
    return;
  }
  const punto = pickGroundAt(x, y);
  if (punto) {
    const valido = risolviPosizioneValida(punto.x, punto.z);
    target = new THREE.Vector3(valido.x, ALTEZZA_OCCHI, valido.z);
    inMovimento = true;
  }
}
function mostraSuggerimento(testo) {
  const el = document.getElementById("suggerimento");
  el.textContent = testo;
  el.classList.add("attivo");
  clearTimeout(window._tSuggerimento);
  window._tSuggerimento = setTimeout(() => el.classList.remove("attivo"), 1400);
}

/* ══════════════════════════════════════════
   LOOP DI RENDER
   ══════════════════════════════════════════ */
function anima() {
  requestAnimationFrame(anima);
  if (inMovimento) {
    camera.position.lerp(target, 0.045);
    if (camera.position.distanceTo(target) < 0.05) inMovimento = false;
  }
  const posValida = risolviPosizioneValida(camera.position.x, camera.position.z);
  camera.position.x = posValida.x;
  camera.position.z = posValida.z;

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const intensita = 0.25 + 0.15 * Math.sin(performance.now() * 0.003);
  materialiPulsanti.forEach(m => { m.emissiveIntensity = intensita; });

  const t = performance.now() * 0.001;
  fiamme.forEach(f => {
    const tremolio = f.base * (0.82 + 0.18 * Math.sin(t * 9 + f.seme) + 0.06 * Math.sin(t * 23 + f.seme));
    f.materiale.emissiveIntensity = tremolio;
    if (f.luce) f.luce.intensity = f.luceBase * (0.8 + 0.2 * Math.sin(t * 9 + f.seme));
  });

  cardineCoperchio.rotation.x += (coperchioTargetAngolo - cardineCoperchio.rotation.x) * 0.06;

  renderer.render(scene, camera);
}
anima();

/* ══════════════════════════════════════════
   AVVIO
   ══════════════════════════════════════════ */
async function avviaStanza() {
  mostraPopup(`<div class="nome">― Caricamento ―</div><div class="testo corsivo">Sto entrando nella partita ${CODICE_PARTITA}…</div>`);
  await caricaStatoRemoto();
  registraIngressoStanza();
  if (serraturaSbloccata(STANZA_ID)) impostaCoperchio(true, true);
  iscrivitiAggiornamenti();
  chiudiPopup();
  iniettaControlliFissi("stanza3cinema.html");
}
document.addEventListener("DOMContentLoaded", avviaStanza);
</script>
